                        "description": "Success"
                    }
                },
                "summary": "Import resources from an external source",
                "operationId": "post_resource_import",
                "requestBody": {
                    "content": {
                        "multipart/form-data": {
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "group": {
                                        "description": "ID of the Group that will own the imported resources.",
                                        "type": "integer"
                                    },
                                    "sourceType": {
                                        "description": "The source of the resources to import('upload_archive', 'upload_files', or 'git'.",
                                        "type": "string"
                                    },
                                    "gitUrl": {
                                        "description": "The URL of the git repository containing resources to import. A git branch can optionally be specified by appending #BRANCH_NAME. Used when sourceType is 'git'.",
                                        "type": "string"
                                    },
                                    "archiveFile": {
                                        "description": "The archive file containing resources to import (.tar.gz). Used when sourceType is 'upload_archive'.",
                                        "type": "string",
                                        "format": "binary"
                                    },
                                    "files": {
                                        "description": "The files containing the resources to import.Used when sourceType is 'upload_files'.",
                                        "type": "array",
                                        "items": {
                                            "type": "file"
                                        }
                                    },
                                    "configPath": {
                                        "description": "The path to the toml configuration file.",
                                        "type": "string",
                                        "default": "dioptra.toml"
                                    },
                                    "resolveNameConflictsStrategy": {
                                        "description": "Strategy for resolving resource name conflicts. Available options are 'fail', 'update', or 'overwrite'",
                                        "type": "string",
                                        "default": "fail"
                                    }
                                },
                                "required": [
                                    "group",
                                    "sourceType"
                                ]
                            }
                        }
                    },
                    "required": true
                },
                "tags": [
                    "Workflows"
                ]
            }
        }
